name: Compilar MiVoz (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Subir el plugin
        uses: actions/upload-artifact@v4
        with:
          name: MiVoz-Windows
          path: |
            build/MiVoz_artefacts/Release/VST3/MiVoz.vst3
            build/MiVoz_artefacts/Release/Standalone/MiVoz.exe
